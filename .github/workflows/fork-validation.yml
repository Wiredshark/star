name: Fork simulation and story validation

on:
  pull_request:
    paths:
      - "data/**"
      - "tests/a1/**"
      - "tools/story/**"
      - "utils/check_content_style.py"
      - "utils/contentStyle.json"
      - ".github/workflows/fork-validation.yml"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "tests/a1/**"
      - "tools/story/**"
      - "utils/check_content_style.py"
      - "utils/contentStyle.json"
      - ".github/workflows/fork-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    name: Focused simulation and story contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest regex

      - name: Compile focused Python validation code
        run: python -m compileall -q tools/story tests/a1

      - name: Run all focused story validators
        run: python tools/story/run_focused_validators.py

      - name: Run A1 simulation contract tests
        run: python -m pytest -q tests/a1

  changed-content-style:
    name: Changed fork content style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install style dependency
        run: python -m pip install --upgrade pip regex

      - name: Check changed fork A/B content style
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/story/check_changed_content_style.py --base "$BASE_SHA" --head "$HEAD_SHA"
